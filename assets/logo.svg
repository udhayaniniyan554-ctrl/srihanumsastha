<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Icon: Stylized Ergonomic Chair Profile -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#emblemBg)"/>
    <rect x="1" y="1" width="58" height="58" rx="11" fill="none" stroke="#166534" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Modern Ergonomic Chair Silhouette in Forest Green -->
    <path d="M 22 18 C 22 16, 32 16, 32 24 L 32 35 C 32 38, 38 38, 42 38 C 44 38, 45 40, 45 42 C 45 44, 43 45, 41 45 L 26 45 C 22 45, 20 42, 20 38 L 20 22 C 20 19, 21 18, 22 18 Z" fill="#22C55E"/>
    <!-- Stem & 5-Star Base -->
    <path d="M 29 45 L 29 51 M 21 53 L 37 53 M 20 53 L 18 55 M 38 53 L 40 55 M 29 51 L 29 53" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(82, 34)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20" fill="#111111" letter-spacing="0.5">
