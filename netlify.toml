# Netlify Configuration for Sri Hanum Sastha Enterprises Website
[build]
  publish = "."
  command = ""

# Security & Cache Control Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean routing and direct deep-link fallback
[[redirects]]
  from = "/products/*"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/categories/*"
  to = "/category.html"
  status = 200
